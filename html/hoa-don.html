<!DOCTYPE HTML>
<html lang = "vi">
    <head>
        <title> Hóa đơn thanh toán </title>
        <meta charset "utf-8">
        <link rel = "stylesheet" href = "../css/style3.css"

    </head>
    <body>
        <div class = "container">
            <h1>Hóa đơn thanh toán</h1>
            <table id = "table" border = "2px">
                <tr>
                    <th> STT</th>
                    <th> Tên sản phẩm</th>
                    <th> Đơn giá</th>
                    <th> Số lượng</th>
                    <th> Đơn vị tính</th>
                    <th> Thành tiền</th>
                </tr>
                <tr>
                    <td> 1</td>
                    <td>Mì gói</td>
                    <td class = "dongia"> 4000</td>
                    <td class = "soluong">10</td>
                    <td> Gói</td>
                    <td class = "thanhtien"></td>
                </tr>

                <tr>
                    <td> 2</td>
                    <td>Pepsi</td>
                    <td class = "dongia"> 10000</td>
                    <td class = "soluong">10</td>
                    <td> Lon</td>
                    <td class = "thanhtien"></td>
                </tr>

                <tr>
                    <td> 3</td>
                    <td>Nước giặt</td>
                    <td class = "dongia"> 200000</td>
                    <td class = "soluong">2</td>
                    <td> Túi</td>
                    <td class = "thanhtien"></td>
                </tr>

                <tr>
                    <td colspan="2" >Tổng thanh toán: </td> 
                    <td colspan="4" id = "thanhtoan"></td> 
                </tr>

                <script>
                    const soluong = document.getElementsByClassName("soluong");
                    const dongia = document.getElementsByClassName("dongia");
                    const thanhtien = document.getElementsByClassName("thanhtien"); 
                    let i = 0; 
                    let thanhtoan = 0;
                    while (i < soluong.length)
                    {
                        let tien = Number(soluong[i].innerHTML)* Number(dongia[i].innerHTML);
                        thanhtien[i].innerHTML = tien;
                        thanhtoan += tien;
                        i++;
                    }
                document.getElementById("thanhtoan").innerHTML = thanhtoan;
                </script>

    </body>
</html>
