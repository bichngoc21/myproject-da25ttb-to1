<!DOCTYPE HTML>
<html lang ="vi">
	<head>
		<title>Thiết kế form đăng ký</title>
		<meta charset ="utf-8">
		<link rel ="stylesheet" href ="../css/style2.css">
	</head>
	<body>
	
		<div class ="container">
			<form id = "frmLogin" action = "xac-thuc.html" method = "get">
			<p id = "tieude"> &#127799 Đăng ký thành viên &#127799</p>
			<div class = "form-group">
				<label for = "txtUsername">Full name: </label>
				<input class = "form-control" type = "text" name = "txtUsername" id = "txtUsername">
			</div>
			
			<div class = "form-group">
				<label for = "txtId">ID: </label>
				<input class = "form-control" type = "Id" name = "txtId" id = "txtId">
			</div>
			
			<div class = "form-group">
				<label for = "txtClass">Class: </label>
				<input class = "form-control" type = "Class" name = "txtClass" id = "txtClass">
			</div>
			
			
			
			<input class = "button" type = "submit" name = "sbLogin" value = "Login">
			<input class = "button"type = "reset" name = "rsCancel" value = "Cancel">
			
		</div>
		
	</body>
</html>
